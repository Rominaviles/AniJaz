<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANIDREX — Tu Guía y Organizador de Anime</title>
  <meta name="description" content="Descubrí, organizá y seguí tus series de anime favoritas en un solo lugar.">

  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <header class="site-header">
    <div class="container nav-bar">
      <a href="index.html" class="logo"><span class="dex">ANI</span>DREX <span class="tag">Organizador</span></a>

      <form class="nav-search" data-nav-search>
        <input type="search" name="q" placeholder="Buscar un anime…" aria-label="Buscar anime">
        <button type="submit">Buscar</button>
      </form>

      <button class="nav-toggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="main-nav">☰</button>

      <nav id="main-nav" class="nav" aria-label="Principal">
        <a href="index.html">Inicio</a>
        <a href="catalogo.html">Catálogo</a>
        <a href="favoritos.html">Mis Favoritos</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="catalog-hero">
      <div class="container">
        <span class="eyebrow">Tu lista</span>
        <h1 class="catalog-title">Mis Favoritos</h1>
        <p class="lead lead-narrow">Entrá a la ficha de cualquier anime para sumarlo o quitarlo de esta lista.</p>
      </div>
    </section>

    <section class="favoritos-section">
      <div class="container">
        <div class="card-grid" id="grid-favoritos" aria-live="polite">
          <div class="loading" role="status">Cargando tus favoritos…</div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-row">
      <p>&copy; 2026 ANIDREX — Tu guía y organizador de anime.</p>
      <p><a href="catalogo.html">Ir al catálogo →</a></p>
    </div>
  </footer>

  <script src="js/fetchs/animeFetch.js"></script>
  <script src="js/mapeos/animeMapper.js"></script>
  <script src="js/metodos/animeFilter.js"></script>
  <script src="js/metodos/animeStorage.js"></script>
  <script src="js/services/animeService.js"></script>
  <script src="js/prueba.js"></script>

</body>

</html>
