<!DOCTYPE html>

<head>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">

<body>

  <header class="site-header">
    <div class="container nav-bar">
      <a href="index.html" class="logo"><span class="dex">ANI</span>DREX <span class="tag">Organizador</span></a>

      <form class="nav-search" data-nav-search>
        <input type="search" name="q" placeholder="Buscar un anime…" aria-label="Buscar anime" autocomplete="off">

      </form>

      <button class="nav-toggle" aria-label="Abrir menú" aria-expanded="false">☰</button>
      <nav class="nav" aria-label="Principal">

        <a href="favoritos.html" class="active">Mis Favoritos</a>
      </nav>

  </header>

  <main>
    <section style="padding-block:2.6rem 0;">
      <div class="container">
        <span class="eyebrow">Tu lista</span>
        <h1 style="font-size:clamp(2rem,5vw,3rem);">Mis Favoritos</h1>
        <p class="lead" style="max-width:50ch;">Entrá a la ficha de cualquier anime para sumarlo o quitarlo de esta lista.</p>
      </div>
    </section>

    <section style="padding-block: 2rem 4rem;">
      <div class="container">
        <div class="card-grid" id="grid-favoritos">
          <div class="loading">Consultando la ficha…</div>
        </div>
      </div>

  <footer class="site-footer">
    <div class="container footer-row">
      <p>&copy; 2026 ANIDREX — Tu guía y organizador de anime.</p>
      <p><a href="catalogo.html">Ir al catálogo →</a></p>
