<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANIJAZ — Tu Guía y Organizador de Anime</title>
  <meta name="description" content="Descubrí, organizá y seguí tus series de anime favoritas en un solo lugar.">

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1f1f1f">

  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <header class="site-header">
    <div class="container nav-bar">
      <a href="index.html" class="logo"><span class="dex">ANI</span>JAZ <span class="tag">Organizador</span></a>

      <form class="nav-search" data-nav-search>
        <input type="search" name="busqueda" placeholder="Buscar un anime…" aria-label="Buscar anime">
        <button type="submit">Buscar</button>
      </form>

      <button class="nav-toggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="main-nav">☰</button>

      <nav id="main-nav" class="nav" aria-label="Principal">
        <a href="index.html">Inicio</a>
        <a href="catalogo.html">Catálogo</a>
        <a href="favoritos.html">Mis Favoritos</a>
        <a href= "contacto.html">Contacto</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="catalog-hero">
      <div class="container">
        <span class="eyebrow">Catálogo completo</span>
        <h1 class="catalog-title">Encontrá tu anime</h1>
      </div>
    </section>

    <section>
      <div class="container">

        <form class="filters" data-form-filtros aria-label="Filtros de catálogo">
          <div class="field-inline">
            <label for="f-genero">Género</label>
            <select id="f-genero" name="genero" class="select-genero">
              <option value="">Todos</option>
            </select>
          </div>

          <div class="field-inline">
            <label for="f-temporada">Temporada</label>
            <select id="f-temporada" name="temporada" class="select-temporada">
              <option value="">Todas</option>
            </select>
          </div>

          <div class="field-inline">
            <label for="f-anio">Año</label>
            <select id="f-anio" name="anio" class="select-anio">
              <option value="">Todos</option>
            </select>
          </div>

          <div class="field-inline">
            <label for="f-estado">Estado</label>
            <select id="f-estado" name="estado" class="select-estado">
              <option value="">Todos</option>
            </select>
          </div>

          <div class="field-inline">
            <label for="f-orden">Ordenar por</label>
            <select id="f-orden" name="orden" class="select-orden">
              <option value="">Por defecto</option>
            </select>
          </div>

          <div class="field-inline field-btn">
            <button type="submit" class="btn-filtrar-catalogo">Filtrar</button>
          </div>

          <div class="field-inline field-btn">
            <button type="button" id="btn-limpiar-filtros" class="btn-limpiar-catalogo">Limpiar</button>
          </div>
        </form>

        <div class="card-grid" id="grid-catalogo" aria-live="polite">
          <div class="loading" role="status">Cargando anime…</div>
        </div>

        <nav id="paginacion-catalogo" class="paginacion" aria-label="Paginación de resultados"></nav>

      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-row">
      <p>&copy; 2026 ANIJAZ — Tu guía y organizador de anime.</p>
      <p><a href="index.html">Volver al inicio →</a></p>
    </div>
  </footer>

  <script src="js/fetchs/animeFetch.js"></script>
  <script src="js/mapeos/animeMapper.js"></script>
  <script src="js/metodos/animeFilter.js"></script>
  <script src="js/metodos/animeStorage.js"></script>
  <script src="js/services/animeService.js"></script>
  <script src="js/metodos/animeText.js"></script>
  <script src="js/prueba.js"></script>

</body>

</html>
