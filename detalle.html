<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANIDREX — Tu Guía y Organizador de Anime</title>
  <meta name="description" content="Descubrí, organizá y seguí tus series de anime favoritas en un solo lugar.">

  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <header class="site-header">
    <div class="container nav-bar">
      <a href="index.html" class="logo"><span class="dex">ANI</span>DREX <span class="tag">Organizador</span></a>

      <form class="nav-search" data-nav-search>
        <input type="search" name="q" placeholder="Buscar un anime…" aria-label="Buscar anime">
        <button type="submit">Buscar</button>
      </form>

      <button class="nav-toggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="main-nav">☰</button>

      <nav id="main-nav" class="nav" aria-label="Principal">
        <a href="index.html">Inicio</a>
        <a href="catalogo.html">Catálogo</a>
        <a href="favoritos.html">Mis Favoritos</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container detail-content" id="detalle-contenido" aria-live="polite">
      <div class="loading" role="status">Consultando el anime…</div>
    </div>
  </main>

  <!-- Modal de preferencias de favorito -->
  <div id="modal-favoritos" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-favoritos-titulo">
    <div class="modal-box">
      <h2 id="modal-favoritos-titulo" class="modal-title">Personalizar Favorito</h2>
      <form id="form-favorito">

        <div class="form-group">
          <label for="fav-estado-seguimiento" class="form-label">Estado de seguimiento *</label>
          <select id="fav-estado-seguimiento" name="estado-seguimiento" required class="form-control">
            <option value="Para ver">Para ver</option>
            <option value="Viendo">Viendo</option>
            <option value="Completado">Completado</option>
          </select>
        </div>

        <div class="form-group">
          <label for="fav-prioridad" class="form-label">Prioridad (1 o mayor) *</label>
          <input type="number" id="fav-prioridad" name="prioridad" min="1" value="1" required class="form-control">
        </div>

        <div class="form-group">
          <label for="fav-etiqueta" class="form-label">Etiqueta personalizada *</label>
          <input type="text" id="fav-etiqueta" name="etiqueta" placeholder="Ej: Recomendado, Shonen top..." required
            class="form-control">
        </div>

        <div class="form-group form-group-last">
          <label for="fav-nota" class="form-label">Nota personal (máx. 200 caract.)</label>
          <textarea id="fav-nota" name="nota" maxlength="200" rows="3" placeholder="Escribí una nota opcional..."
            class="form-control form-textarea"></textarea>
        </div>

        <div class="modal-actions">
          <button type="button" id="btn-cerrar-modal" class="modal-btn-cancel">Cancelar</button>
          <button type="submit" class="modal-btn-save">Guardar</button>
        </div>

      </form>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container footer-row">
      <p>&copy; 2026 ANIDREX — Tu guía y organizador de anime.</p>
      <p><a href="catalogo.html">← Volver al catálogo</a></p>
    </div>
  </footer>

  <script src="js/fetchs/animeFetch.js"></script>
  <script src="js/mapeos/animeMapper.js"></script>
  <script src="js/metodos/animeFilter.js"></script>
  <script src="js/metodos/animeStorage.js"></script>
  <script src="js/services/animeService.js"></script>
  <script src="js/prueba.js"></script>

</body>

</html>
