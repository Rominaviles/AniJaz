<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ficha de anime — ANIDREX</title>
  <meta name="description" content="Ficha detallada de un anime: sinopsis, estudio, episodios y valoración.">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <header class="site-header">
    <div class="container nav-bar">
      <a href="index.html" class="logo"><span class="dex">ANI</span>DREX <span class="tag">Organizador</span></a>

      <form class="nav-search" data-nav-search>
        <input type="search" name="q" placeholder="Buscar un anime…" aria-label="Buscar anime" autocomplete="off">
        <button type="submit">Buscar</button>
      </form>

      <button class="nav-toggle" aria-label="Abrir menú" aria-expanded="false">☰</button>
      <nav class="nav" aria-label="Principal">
        <a href="index.html">Inicio</a>
        <a href="catalogo.html">Catálogo</a>
        <a href="favoritos.html">Mis Favoritos</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container" id="detalle-contenido" style="padding-block: 2.6rem;">
      <div class="loading">Consultando el archivo…</div>
    </div>
  </main>

   <!-- Modal de Preferencias para Favoritos (debe estar en detalle.html o en las vistas donde se interactúe con el modal) -->
  <div id="modal-favoritos" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; align-items:center; justify-content:center;">
    <div style="background:#1e2230; padding:2rem; border-radius:8px; max-width:450px; width:90%; color:#fff; border:1px solid #3a3f58;">
      <h2 style="margin-top:0;">Personalizar Favorito</h2>
      <form id="form-favorito">
        
        <div style="margin-bottom:1rem;">
          <label style="display:block; margin-bottom:0.4rem;">Estado de seguimiento *</label>
          <select id="fav-estado-seguimiento" required style="width:100%; padding:0.5rem; background:#12151e; color:#fff; border:1px solid #4a4d68; border-radius:4px;">
            <option value="Para ver">Para ver</option>
            <option value="Viendo">Viendo</option>
            <option value="Completado">Completado</option>
          </select>
        </div>

        <div style="margin-bottom:1rem;">
          <label style="display:block; margin-bottom:0.4rem;">Prioridad (1 o mayor) *</label>
          <input type="number" id="fav-prioridad" min="1" value="1" required style="width:100%; padding:0.5rem; background:#12151e; color:#fff; border:1px solid #4a4d68; border-radius:4px;">
        </div>

        <div style="margin-bottom:1rem;">
          <label style="display:block; margin-bottom:0.4rem;">Etiqueta personalizada *</label>
          <input type="text" id="fav-etiqueta" placeholder="Ej: Recomendado, Shonen top..." required style="width:100%; padding:0.5rem; background:#12151e; color:#fff; border:1px solid #4a4d68; border-radius:4px;">
        </div>

        <div style="margin-bottom:1.5rem;">
          <label style="display:block; margin-bottom:0.4rem;">Nota personal (máx. 200 caract.)</label>
          <textarea id="fav-nota" maxlength="200" rows="3" placeholder="Escribí una nota opcional..." style="width:100%; padding:0.5rem; background:#12151e; color:#fff; border:1px solid #4a4d68; border-radius:4px; resize:none;"></textarea>
        </div>

        <div style="display:flex; gap:1rem; justify-content:flex-end;">
          <button type="button" id="btn-cerrar-modal" style="padding:0.5rem 1rem; background:#4a4d68; color:#fff; border:none; border-radius:4px; cursor:pointer;">Cancelar</button>
          <button type="submit" style="padding:0.5rem 1.5rem; background:#e63946; color:#fff; border:none; border-radius:4px; cursor:pointer;">Guardar</button>
        </div>

      </form>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container footer-row">
      <p>&copy; 2026 ANIDREX — Tu guía y organizador de anime.</p>
      <p><a href="catalogo.html">← Volver al catálogo</a></p>
    </div>
  </footer>

  <script src="js/fetchs/animeFetch.js"></script>
  <script src="js/mapeos/animeMapper.js"></script>
  <script src="js/metodos/animeFilter.js"></script>
  <script src="js/services/animeService.js"></script>
  <script src="js/prueba.js"></script>
</body>

</html>
